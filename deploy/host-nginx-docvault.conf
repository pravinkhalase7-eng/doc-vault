# Host nginx for https://__DOMAIN__
# Jenkins copies this file to /etc/nginx/sites-available/docvault on deploy.
# Docker DocVault still listens on 8088 (live) and optionally 8089 (standby).
# Edge aicoder-nginx owns public 80/443; this file is only used if host nginx is enabled.

upstream docvault_local {
    server 127.0.0.1:8088 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8089 max_fails=1 fail_timeout=5s backup;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;
    client_max_body_size 60m;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://docvault_local;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
