events {}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 60m;

  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(self), microphone=()" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  map $http_x_forwarded_proto $docvault_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=ai:10m rate=2r/s;

  upstream frontend { server frontend:3000; }
  upstream backend { server backend:8000; }

  server {
    listen 80;
    server_name 187.127.138.86;
    return 301 https://docvault.doxstation.com$request_uri;
  }

  server {
    listen 80;
    server_name _;

    # Do not expose storage directories.
    location ^~ /var/lib/docvault {
      deny all;
      return 404;
    }

    location /api/v1/ai/ {
      limit_req zone=ai burst=5 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto $docvault_proto;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $docvault_proto;
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $docvault_proto;
    }
  }
}
