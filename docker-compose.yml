services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docvault-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docvault}
      POSTGRES_DB: ${POSTGRES_DB:-docvault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docvault}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: docvault-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ${API_IMAGE:-docvault-api:latest}
    container_name: docvault-api
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docvault}:${POSTGRES_PASSWORD:-docvault}@postgres:5432/${POSTGRES_DB:-docvault}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-docvault}:${POSTGRES_PASSWORD:-docvault}@postgres:5432/${POSTGRES_DB:-docvault}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_ROOT: /var/lib/docvault
    volumes:
      - ${STORAGE_HOST_PATH:-/var/lib/docvault}:/var/lib/docvault
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  celery_worker:
    image: ${API_IMAGE:-docvault-api:latest}
    container_name: docvault-celery-worker
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docvault}:${POSTGRES_PASSWORD:-docvault}@postgres:5432/${POSTGRES_DB:-docvault}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-docvault}:${POSTGRES_PASSWORD:-docvault}@postgres:5432/${POSTGRES_DB:-docvault}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_ROOT: /var/lib/docvault
    volumes:
      - ${STORAGE_HOST_PATH:-/var/lib/docvault}:/var/lib/docvault
    depends_on:
      - backend
      - redis

  celery_beat:
    image: ${API_IMAGE:-docvault-api:latest}
    container_name: docvault-celery-beat
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docvault}:${POSTGRES_PASSWORD:-docvault}@postgres:5432/${POSTGRES_DB:-docvault}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-docvault}:${POSTGRES_PASSWORD:-docvault}@postgres:5432/${POSTGRES_DB:-docvault}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - redis
      - backend

  frontend:
    image: ${WEB_IMAGE:-docvault-web:latest}
    container_name: docvault-web
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-DocVault}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: docvault-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${WEB_HOST_PORT:-80}:80"
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
